name: PageSpeed Monitor

on:
  # Temporarily disabled: no automatic execution.
  # Keep manual dispatch available for future reimplementation/testing.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pagespeed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lighthouse CI (Remote)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.remote.cjs
          urls: 'https://mafhper.github.io/spread'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Lighthouse CI (Local)
        run: |
          bun run preview &
          sleep 10
          npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
