name: PageSpeed Monitor

on:
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  pagespeed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: PageSpeed Insights (Remote)
        uses: jakepartusch/psi-action@v1.3
        with:
          url: https://mafhper.github.io/spread
          key: ${{ secrets.PAGESPEED_API_KEY }}
          threshold: 90

      - name: Lighthouse CI (Local)
        run: |
          bun run preview &
          sleep 10
          npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
