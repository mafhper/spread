version: 2
updates:
  # Pausa temporaria dos updates de versao do bun (2026-10-13):
  # o motor atual do Dependabot regenera o bun.lock em lockfileVersion 3,
  # que o bun pinado no CI (1.3.13) ainda nao le — os PRs chegariam
  # vermelhos. Reativar (5) junto com a migracao do CI para o bun 1.4.
  # Updates de seguranca nao sao afetados (limite proprio no GitHub).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '09:30'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
